# ModelOps CI — lint, test, local Docker build.
# Deploy to Cloud Run runs only on push to main (WIF + GCS model). No TLC downloads.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.11.2"

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,api,tracking]"

      - name: Run pytest
        env:
          # Keep MLflow file store inside the runner workspace (gitignored pattern).
          MLFLOW_TRACKING_URI: file:./mlruns-ci
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: modelops-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Cloud Run
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      MODEL_BUCKET: ${{ secrets.GCP_MODEL_BUCKET }}
      REPO: modelops
      SERVICE: modelops-api
      IMAGE_NAME: modelops-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require GitHub Secrets
        run: |
          missing=0
          if [[ -z "${PROJECT_ID}" ]]; then echo "Missing secret GCP_PROJECT_ID" >&2; missing=1; fi
          if [[ -z "${MODEL_BUCKET}" ]]; then echo "Missing secret GCP_MODEL_BUCKET" >&2; missing=1; fi
          if [[ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]]; then
            echo "Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER" >&2
            missing=1
          fi
          if [[ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "Missing secret GCP_SERVICE_ACCOUNT" >&2
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "Run ./scripts/gcp_wif_setup.sh then set secrets with gh secret set (see docs)." >&2
            exit 1
          fi
          echo "REGION=${REGION:-us-central1}" >> "${GITHUB_ENV}"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download approved model from GCS
        run: |
          set -euo pipefail
          mkdir -p models/approved
          if ! gcloud storage ls "gs://${MODEL_BUCKET}/approved/model.joblib" >/dev/null 2>&1; then
            echo "Missing gs://${MODEL_BUCKET}/approved/model.joblib" >&2
            echo "Upload with: ./scripts/gcp_upload_model.sh" >&2
            exit 1
          fi
          if ! gcloud storage ls "gs://${MODEL_BUCKET}/approved/model.metrics.json" >/dev/null 2>&1; then
            echo "Missing gs://${MODEL_BUCKET}/approved/model.metrics.json" >&2
            exit 1
          fi
          gcloud storage cp \
            "gs://${MODEL_BUCKET}/approved/model.joblib" \
            "gs://${MODEL_BUCKET}/approved/model.metrics.json" \
            models/approved/

      - name: Ensure Artifact Registry repo
        run: |
          set -euo pipefail
          REGION="${REGION:-us-central1}"
          if ! gcloud artifacts repositories describe "${REPO}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${REPO}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="ModelOps API images" \
              --project="${PROJECT_ID}"
          fi

      # Build on the runner and push to Artifact Registry (avoids Cloud Build
      # source-bucket / org-policy friction with WIF service accounts).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        run: |
          set -euo pipefail
          REGION="${REGION:-us-central1}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push Cloud Run image
        run: |
          set -euo pipefail
          REGION="${REGION:-us-central1}"
          TAG="${GITHUB_SHA::7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE=${IMAGE}:${TAG}" >> "${GITHUB_ENV}"
          docker build \
            -f Dockerfile.cloudrun \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          REGION="${REGION:-us-central1}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${TAG}"
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=40 \
            --timeout=60 \
            --set-env-vars="MODELOPS_ENV=production,MODELOPS_LOG_LEVEL=INFO,MODELOPS_APPROVED_MODEL_PATH=/models/approved/model.joblib,MODELOPS_MODEL_PATH=/models/approved/model.joblib" \
            --quiet

      - name: Smoke
        run: |
          set -euo pipefail
          REGION="${REGION:-us-central1}"
          URL="$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          echo "URL=${URL}"
          curl -fsS "${URL}/health"
          echo
          curl -fsS "${URL}/ready"
          echo
          curl -fsS "${URL}/predict" \
            -H 'Content-Type: application/json' \
            -d '{"passenger_count":1,"PULocationID":161,"DOLocationID":236,"pickup_hour":8,"pickup_dow":2,"pickup_day":15}'
          echo
