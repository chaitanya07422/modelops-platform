# ModelOps default configuration (Milestone 0 placeholders).
# Concrete values for data paths, features, and quality gates are filled in
# when Milestone 1 implements ingestion and training.

project:
  name: modelops
  environment: development

data:
  # Chosen TLC month is documented in docs/DATASET_AND_MODEL.md (Milestone 1).
  year: 2024
  month: 1
  max_rows: 50000
  raw_dir: data/raw
  processed_dir: data/processed
  fixtures_dir: data/fixtures

training:
  random_seed: 42
  # Chronological split by pickup time (earlier = train, later = eval).
  split_strategy: time_based
  train_fraction: 0.8

model:
  approved_path: models/approved/model.joblib
  candidate_dir: models/candidates

api:
  host: 0.0.0.0
  port: 8000

mlflow:
  tracking_uri: file:./mlruns
  experiment_name: modelops-taxi-fare

quality_gates:
  # Provisional ideas from the M1 baseline (MAE≈5.6, RMSE≈8.6, R²≈0.57).
  # Enforcement arrives with promotion automation in Milestone 3.
  max_mae: 10.0
  max_rmse: 15.0
  min_r2: 0.3
