# Local ModelOps API + monitoring stack.
# Prerequisite: an approved model at ./models/approved/model.joblib
#   python -m modelops.training --download-if-missing
#   python -m modelops.lifecycle promote

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: modelops-api:local
    container_name: modelops-api
    ports:
      - "8000:8000"
    environment:
      MODELOPS_ENV: production
      MODELOPS_LOG_LEVEL: INFO
      MODELOPS_API_HOST: 0.0.0.0
      MODELOPS_API_PORT: 8000
      MODELOPS_APPROVED_MODEL_PATH: /models/approved/model.joblib
      MODELOPS_MODEL_PATH: /models/approved/model.joblib
    volumes:
      - ./models/approved:/models/approved:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: modelops-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: modelops-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: modelops
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
